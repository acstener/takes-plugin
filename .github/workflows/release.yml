# Packs connector/ into blazing-video.mcpb and attaches it to a GitHub release
# named after server.json's version (v<version>), once per version. The MCP
# registry entry (server.json) points at that file.
name: Release connector
on:
  push:
    branches: [main]
    paths: [server.json, connector/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r .version server.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          npx -y @anthropic-ai/mcpb validate connector/manifest.json
          npx -y @anthropic-ai/mcpb pack connector blazing-video.mcpb
          sha256sum blazing-video.mcpb | tee blazing-video.mcpb.sha256
          gh release create "$TAG" blazing-video.mcpb blazing-video.mcpb.sha256 \
            --title "Blazing Video $TAG" \
            --notes "Claude app connector for the Blazing Video Mac app. SHA-256: $(cut -d' ' -f1 blazing-video.mcpb.sha256)"
